[project]
name = "resolveai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "langgraph>=1.2.16",
    "langchain-deepseek>=1.1.1",
    "openai>=3",
    "celery>=5.6.3",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langsmith>=0.14.11",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
